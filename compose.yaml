services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wattsup
      POSTGRES_USER: wattsup
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-wattsup}
    volumes:
      - wattsup-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wattsup -d wattsup"]
      interval: 5s
      timeout: 3s
      retries: 10

  wattsup:
    build: .
    container_name: wattsup
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://wattsup:${DATABASE_PASSWORD:-wattsup}@postgres:5432/wattsup
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - wattsup-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  wattsup-data:
  wattsup-postgres:
